name: vibe-coded-apps

networks:
  vibe-network:
    driver: bridge

volumes:
  supabase_db_data:
  strix_reports:

services:
  # -------------------------------------------------------------
  # 1. Reverse Proxy & Gateway (Nginx)
  # -------------------------------------------------------------
  vibe-nginx:
    image: nginx:1.27-alpine
    container_name: vibe-nginx
    restart: unless-stopped
    ports:
      - "${HOST_HTTP_PORT:-8088}:80"
      - "${HOST_HTTPS_PORT:-8443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    networks:
      - vibe-network
    depends_on:
      - vibe-web
      - vibe-supabase-kong
      - vibe-supabase-auth

  # -------------------------------------------------------------
  # 2. Main Web & Micro Apps (Next.js / Node Container)
  # -------------------------------------------------------------
  vibe-web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: vibe-web
    restart: unless-stopped
    volumes:
      - ./web:/app
      - /app/node_modules
    environment:
      - NODE_ENV=production
      - PORT=3000
      - SUPABASE_URL=http://vibe-supabase-kong:8000
      - SUPABASE_ANON_KEY=${ANON_KEY}
      - SERVICE_ROLE_KEY=${SERVICE_ROLE_KEY}
    networks:
      - vibe-network
    expose:
      - "3000"

  # -------------------------------------------------------------
  # 3. Supabase Database (PostgreSQL)
  # -------------------------------------------------------------
  vibe-supabase-db:
    image: supabase/postgres:15.6.1.143
    container_name: vibe-supabase-db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - supabase_db_data:/var/lib/postgresql/data
      - ./supabase/volumes/db/init:/docker-entrypoint-initdb.d
    networks:
      - vibe-network
    expose:
      - "5432"

  # -------------------------------------------------------------
  # 4. Supabase Auth (GoTrue - Google & GitHub SSO)
  # -------------------------------------------------------------
  vibe-supabase-auth:
    image: supabase/gotrue:v2.164.0
    container_name: vibe-supabase-auth
    restart: unless-stopped
    depends_on:
      vibe-supabase-db:
        condition: service_healthy
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: ${APP_URL:-http://localhost:8088}/auth/v1

      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@vibe-supabase-db:5432/postgres?sslmode=disable

      GOTRUE_SITE_URL: ${APP_URL:-http://0.0.0.0:8088}
      GOTRUE_URI_ALLOW_LIST: "${APP_URL:-http://0.0.0.0:8088}/*,http://localhost:8088/*,http://127.0.0.1:8088/*,http://0.0.0.0:8088/*"

      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      GOTRUE_JWT_EXP: 2592000
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated

      # External OAuth Providers (Google & GitHub)
      GOTRUE_EXTERNAL_GOOGLE_ENABLED: ${GOTRUE_EXTERNAL_GOOGLE_ENABLED:-true}
      GOTRUE_EXTERNAL_GOOGLE_CLIENT_ID: ${GOTRUE_EXTERNAL_GOOGLE_CLIENT_ID:-}
      GOTRUE_EXTERNAL_GOOGLE_SECRET: ${GOTRUE_EXTERNAL_GOOGLE_SECRET:-}
      GOTRUE_EXTERNAL_GOOGLE_REDIRECT_URI: ${GOTRUE_EXTERNAL_GOOGLE_REDIRECT_URI:-}

      GOTRUE_EXTERNAL_GITHUB_ENABLED: ${GOTRUE_EXTERNAL_GITHUB_ENABLED:-true}
      GOTRUE_EXTERNAL_GITHUB_CLIENT_ID: ${GOTRUE_EXTERNAL_GITHUB_CLIENT_ID:-}
      GOTRUE_EXTERNAL_GITHUB_SECRET: ${GOTRUE_EXTERNAL_GITHUB_SECRET:-}
      GOTRUE_EXTERNAL_GITHUB_REDIRECT_URI: ${GOTRUE_EXTERNAL_GITHUB_REDIRECT_URI:-}

      GOTRUE_DISABLE_SIGNUP: "false"
      GOTRUE_MAILER_AUTOCONFIRM: "true"
    networks:
      - vibe-network
    expose:
      - "9999"

  # -------------------------------------------------------------
  # 5. Supabase PostgREST (REST API)
  # -------------------------------------------------------------
  vibe-supabase-rest:
    image: postgrest/postgrest:v12.2.0
    container_name: vibe-supabase-rest
    restart: unless-stopped
    depends_on:
      vibe-supabase-db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://postgres:${POSTGRES_PASSWORD}@vibe-supabase-db:5432/postgres
      PGRST_DB_SCHEMAS: public,storage
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET}
    networks:
      - vibe-network
    expose:
      - "3000"

  # -------------------------------------------------------------
  # 6. Supabase API Gateway (Kong)
  # -------------------------------------------------------------
  vibe-supabase-kong:
    image: kong:2.8.1-alpine
    container_name: vibe-supabase-kong
    restart: unless-stopped
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /var/lib/kong/kong.yml
      KONG_DNS_ORDER: LAST,A,CNAME
      KONG_PLUGINS: request-transformer,cors,key-auth,acl
      KONG_NGINX_PROXY_PROXY_BUFFER_SIZE: 160k
      KONG_NGINX_PROXY_PROXY_BUFFERS: 64 160k
    volumes:
      - ./supabase/volumes/kong/kong.yml:/var/lib/kong/kong.yml:ro
    networks:
      - vibe-network
    expose:
      - "8000"

  # -------------------------------------------------------------
  # 7. AI Security Pentesting Agent (Strix)
  # -------------------------------------------------------------
  vibe-strix:
    build:
      context: ./security
      dockerfile: Dockerfile
    container_name: vibe-strix
    restart: unless-stopped
    environment:
      - STRIX_TARGET_URL=${STRIX_TARGET_URL:-http://vibe-nginx:80}
      - STRIX_LLM=${STRIX_LLM:-gemini/gemini-2.5-pro}
      - STRIX_LLM_API_KEY=${STRIX_LLM_API_KEY:-}
    volumes:
      - ./security/reports:/strix/reports
      - ./security/scripts:/strix/scripts
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - vibe-network
